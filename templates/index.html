<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noobster Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-main: #0e1621; --bg-sidebar: #17212b; --bg-hover: #202b36; --text-main: #ffffff; --text-muted: #7d8b99; --border-color: #101921; --bubble-in: #182533; --bubble-out: #2b5278; --accent: #2b5278; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { height: 100vh; height: 100dvh; background: var(--bg-main); color: var(--text-main); overflow: hidden; display: flex; flex-direction: column; }

        #authScreen { position: fixed; inset: 0; background: var(--bg-main); display: flex; justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
        .auth-box { background: var(--bg-sidebar); padding: 40px 30px; border-radius: 20px; width: 100%; max-width: 380px; text-align: center; }
        .auth-box input { width: 100%; padding: 15px; margin: 20px 0; border-radius: 12px; border: 1px solid var(--accent); background: var(--bg-main); color: #fff; text-align: center; }
        .auth-box button { width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--accent); color: #fff; font-weight: bold; cursor: pointer; }

        #mainScreen { display: none; flex: 1; flex-direction: column; height: 100%; }
        .top-header { background: var(--bg-sidebar); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .add-btn { background: var(--accent); color: #fff; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        #accountsView { flex: 1; padding: 15px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; align-content: start; }
        .acc-card { background: var(--bg-sidebar); border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; border: 1px solid var(--border-color); position: relative; }
        .acc-card img { width: 60px; height: 60px; border-radius: 50%; margin-bottom: 10px; }
        .acc-card h3 { font-size: 14px; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .acc-card p { font-size: 12px; color: var(--text-muted); }
        .info-icon { position: absolute; top: 10px; right: 10px; color: #4a8cc7; font-size: 16px; font-weight: bold; cursor: pointer; padding: 5px; }

        #chatView { display: none; flex: 1; flex-direction: row; height: 100%; position: relative; overflow: hidden; }
        #sidebar { width: 100%; height: 100%; background: var(--bg-sidebar); display: flex; flex-direction: column; position: absolute; inset: 0; z-index: 10; transition: transform 0.3s ease; }
        #sidebar.hidden { transform: translateX(-100%); }
        .sidebar-header { padding: 15px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border-color); }
        .back-btn { background: transparent; border: none; color: #fff; font-size: 24px; padding: 0 10px; cursor: pointer; }
        #activeAccName { font-weight: 500; font-size: 16px; }
        #chatList { flex: 1; overflow-y: auto; }
        .chat-item { padding: 12px 15px; border-bottom: 1px solid var(--border-color); display: flex; gap: 12px; align-items: center; cursor: pointer; }
        .chat-dp { width: 45px; height: 45px; border-radius: 50%; background: var(--accent); display: flex; justify-content: center; align-items: center; font-weight: bold; flex-shrink: 0; }
        .chat-details { flex: 1; min-width: 0; }
        .chat-name { font-weight: 500; font-size: 15px; }
        .chat-last { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #messageArea { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); width: 100%; height: 100%; position: absolute; inset: 0; z-index: 20; transition: transform 0.3s ease; }
        #messageArea.hidden { transform: translateX(100%); }
        .msg-header { padding: 12px 15px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; z-index: 21; }
        .msg-back { background: transparent; border: none; color: #fff; font-size: 24px; padding: 0 10px; cursor: pointer; }
        .msg-title { font-weight: 500; font-size: 16px; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg-row { display: flex; width: 100%; }
        .msg-row.mine { justify-content: flex-end; }
        .msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; font-size: 15px; word-wrap: break-word; position: relative; }
        .msg.incoming { background: var(--bubble-in); border-bottom-left-radius: 4px; }
        .msg.outgoing { background: var(--bubble-out); border-bottom-right-radius: 4px; }
        .del-btn { color: #e74c3c; cursor: pointer; margin-left: 8px; font-size: 12px; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-box { background: var(--bg-sidebar); padding: 25px; border-radius: 15px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; max-height: 90vh; overflow-y: auto; position: relative; }
        .modal-box h3 { text-align: center; color: #4a8cc7; }
        .modal-box input, .modal-box textarea { padding: 12px; border-radius: 10px; border: 1px solid var(--accent); background: var(--bg-main); color: #fff; width: 100%; }
        .modal-box button { padding: 12px; border-radius: 10px; border: none; color: #fff; font-weight: bold; cursor: pointer; }
        .btn-primary { background: var(--accent); }
        .btn-danger { background: #e74c3c; }
        .btn-warning { background: #f39c12; }
        .btn-success { background: #2ecc71; }
        .btn-dark { background: #333; }
        .close-btn { position: absolute; top: 10px; right: 15px; background: transparent; border: none; color: #fff; font-size: 20px; cursor: pointer; }

        .info-row { background: #0e1621; padding: 10px; border-radius: 10px; font-size: 13px; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .info-row span { color: #4a8cc7; font-weight: 500; }
    </style>
</head>
<body>

    <div id="authScreen">
        <div class="auth-box">
            <h2>Noobster Panel</h2>
            <input type="password" id="accessKeyInput" placeholder="Enter Access Key">
            <button onclick="verifyKey()">Login</button>
            <p id="authError" style="color: #e74c3c; margin-top: 10px;"></p>
        </div>
    </div>

    <div id="addAccountModal" class="modal-overlay">
        <div class="modal-box">
            <h3>Add New Account</h3>
            <input type="text" id="apiIdInput" placeholder="API ID">
            <input type="text" id="apiHashInput" placeholder="API HASH">
            <textarea id="sessionInput" placeholder="Paste String Session here..." rows="3"></textarea>
            <button class="btn-primary" onclick="addAccount()">Connect Account</button>
            <button class="btn-dark" onclick="openModal('qrModal')">📱 Login via QR</button>
            <p id="addAccError" style="color: #e74c3c; text-align: center;"></p>
            <button class="btn-dark" onclick="closeModal('addAccountModal')">Cancel</button>
        </div>
    </div>

    <div id="qrModal" class="modal-overlay">
        <div class="modal-box">
            <h3>QR Login</h3>
            <input type="text" id="qrApiId" placeholder="API ID">
            <input type="text" id="qrApiHash" placeholder="API Hash">
            <button class="btn-primary" onclick="startQr()">Generate QR</button>
            <div id="qrImageContainer" style="text-align:center; margin-top:15px;"></div>
            <p id="qrStatus" style="text-align:center; color:#f1c40f;"></p>
            <button class="btn-dark" onclick="closeModal('qrModal')">Cancel</button>
        </div>
    </div>

    <div id="profileModal" class="modal-overlay">
        <div class="modal-box">
            <button class="close-btn" onclick="closeModal('profileModal')">&times;</button>
            <h3>Account Profile</h3>
            <div id="profileData">
                <div class="info-row">Name: <span id="profName"></span></div>
                <div class="info-row">User ID: <span id="profId"></span></div>
                <div class="info-row">Username: <span id="profUsername"></span></div>
                <div class="info-row">Phone: <span id="profPhone"></span></div>
                <div class="info-row">2FA Status: <span id="prof2fa"></span></div>
                <div class="info-row" id="starsRow" style="display:none;">⭐ Stars: <span id="profStars"></span></div>
            </div>
            <button class="btn-success" onclick="openSendStars()" style="margin-top:5px;">⭐ Send Stars Gift</button>
            <h4 style="color:#aaa; margin-top:10px;">Active Devices</h4>
            <div id="profDevices" style="background: #0e1621; padding: 10px; border-radius: 10px; font-size: 12px; max-height: 100px; overflow-y: auto;"></div>
            <h4 style="color:#aaa; margin-top:10px;">Admin / Owner Channels</h4>
            <div id="profAdminChats" style="background: #0e1621; padding: 10px; border-radius: 10px; font-size: 13px; max-height: 120px; overflow-y: auto;"></div>
            <button class="btn-primary" onclick="openSettings()" style="margin-top: 10px;">⚙️ Session & Security Settings</button>
        </div>
    </div>

    <div id="settingsModal" class="modal-overlay">
        <div class="modal-box">
            <h3>Security Settings</h3>
            <button class="btn-warning" onclick="terminateSession('current')">🚪 Terminate Current Session</button>
            <button class="btn-danger" onclick="terminateSession('all')">☠️ Terminate All Other Devices</button>
            <button class="btn-primary" onclick="open2faModal()" style="background: #8e44ad;">🔑 Change 2FA Password</button>
            <button class="btn-dark" onclick="closeModal('settingsModal')">Close</button>
        </div>
    </div>

    <div id="twoFaModal" class="modal-overlay">
        <div class="modal-box">
            <h3>Change 2FA Password</h3>
            <input type="password" id="current2faPass" placeholder="Current Password (blank if none)">
            <input type="password" id="new2faPass" placeholder="New Password">
            <button class="btn-primary" onclick="submit2fa()" style="background: #8e44ad;">Update Password</button>
            <p id="2faError" style="text-align: center;"></p>
            <button class="btn-dark" onclick="closeModal('twoFaModal')">Cancel</button>
        </div>
    </div>

    <div id="sendStarsModal" class="modal-overlay">
        <div class="modal-box">
            <h3>Send Stars Gift</h3>
            <input type="text" id="starsTarget" placeholder="@username or t.me/channel link">
            <input type="number" id="starsGiftId" placeholder="Gift ID (e.g. 5170233102089322406)">
            <button class="btn-success" onclick="sendStarsGift()">Send Gift</button>
            <p id="starsError" style="text-align: center;"></p>
            <button class="btn-dark" onclick="closeModal('sendStarsModal')">Cancel</button>
        </div>
    </div>

    <div id="mainScreen">
        <div class="top-header" id="mainHeader">
            <h2>My Accounts</h2>
            <button class="add-btn" onclick="openModal('addAccountModal')">+ Add</button>
        </div>
        <div id="accountsView"></div>

        <div id="chatView">
            <div id="sidebar">
                <div class="sidebar-header">
                    <button class="back-btn" onclick="backToAccounts()">←</button>
                    <span id="activeAccName">Chats</span>
                </div>
                <div id="chatList"></div>
            </div>
            <div id="messageArea" class="hidden">
                <div class="msg-header">
                    <button class="msg-back" onclick="closeChat()">←</button>
                    <div class="msg-title" id="chatHeader">Select a chat</div>
                </div>
                <div id="messages"></div>
            </div>
        </div>
    </div>

    <script>
        const TOKEN = "secure_token_noobster";
        let currentAccId = null;
        let currentChatId = null;
        let qrPollInterval = null;

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        async function verifyKey() {
            const res = await fetch('/api/auth', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ accessKey: document.getElementById('accessKeyInput').value })
            });
            if (res.ok) {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('mainScreen').style.display = 'flex';
                loadAccountsGrid();
            } else { document.getElementById('authError').innerText = "Invalid Key!"; }
        }

        async function loadAccountsGrid() {
            const res = await fetch('/api/accounts', { headers: { 'authorization': TOKEN } });
            const accounts = await res.json();
            const grid = document.getElementById('accountsView');
            grid.innerHTML = '';
            accounts.forEach(acc => {
                const card = document.createElement('div');
                card.className = 'acc-card';
                card.innerHTML = `
                    <img src="${acc.photo}">
                    <h3>${acc.name}</h3>
                    <p>📱 ${acc.phone}</p>
                    <div class="info-icon" onclick="event.stopPropagation(); openProfile('${acc.id}')">ℹ️</div>
                `;
                card.onclick = () => openAccountChats(acc.id, acc.name);
                grid.appendChild(card);
            });
        }

        async function openProfile(accId) {
            currentAccId = accId;
            document.getElementById('profName').innerText = "Loading...";
            document.getElementById('profId').innerText = "...";
            document.getElementById('profUsername').innerText = "...";
            document.getElementById('profPhone').innerText = "...";
            document.getElementById('prof2fa').innerText = "...";
            document.getElementById('profDevices').innerHTML = "Loading...";
            document.getElementById('profAdminChats').innerHTML = "Loading...";
            document.getElementById('starsRow').style.display = 'none';
            openModal('profileModal');

            const res = await fetch(`/api/profile/${accId}`, { headers: { 'authorization': TOKEN } });
            const p = await res.json();
            if(!res.ok) return alert(p.error);

            document.getElementById('profName').innerText = p.name;
            document.getElementById('profId').innerText = p.id;
            document.getElementById('profUsername').innerText = "@" + p.username;
            document.getElementById('profPhone').innerText = "+" + p.phone;
            const fa = document.getElementById('prof2fa');
            fa.innerText = p.has_2fa ? "Enabled ✅" : "Disabled ❌";
            fa.style.color = p.has_2fa ? "#2ecc71" : "#e74c3c";

            document.getElementById('profDevices').innerHTML = p.devices.map(d => `<div class="info-row">${d.device} (${d.ip}) ${d.current ? '<b style="color:#2ecc71;">[Current]</b>' : ''}</div>`).join('');

            const adminDiv = document.getElementById('profAdminChats');
            if(p.admin_chats.length === 0) adminDiv.innerHTML = '<p style="color:#777;">No Admin/Owner channels found.</p>';
            else adminDiv.innerHTML = p.admin_chats.map(c => {
                let handle = '';
                if (c.username) handle = `<a href="https://t.me/${c.username}" target="_blank" style="color:#4a8cc7;">@${c.username}</a>`;
                else if (c.invite_link) handle = `<a href="${c.invite_link}" target="_blank" style="color:#2ecc71;">🔗 Invite</a>`;
                else handle = `<span style="color:#777;">private</span>`;
                return `<div class="info-row"><span style="color:#fff;">${c.name}</span><span>${handle} · <b style="color:${c.type==='Owner'?'#e74c3c':'#f1c40f'};">${c.type}</b></span></div>`;
            }).join('');

            // Stars balance
            try {
                const sr = await fetch(`/api/stars/${accId}`, { headers: { 'authorization': TOKEN } });
                const sd = await sr.json();
                if (sd.balance !== undefined) {
                    document.getElementById('starsRow').style.display = 'flex';
                    document.getElementById('profStars').innerText = sd.balance;
                }
            } catch(e) {}
        }

        function openSettings() { closeModal('profileModal'); openModal('settingsModal'); }
        function open2faModal() { closeModal('settingsModal'); openModal('twoFaModal'); }
        function openSendStars() { closeModal('profileModal'); openModal('sendStarsModal'); }

        async function terminateSession(action) {
            if(!confirm(`Are you sure?`)) return;
            const res = await fetch('/api/terminate', {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'authorization': TOKEN },
                body: JSON.stringify({ acc_id: currentAccId, action: action })
            });
            const d = await res.json();
            alert(d.message || d.error);
            if(res.ok && action === 'current') { closeModal('settingsModal'); backToAccounts(); }
        }

        async function submit2fa() {
            const res = await fetch('/api/change-2fa', {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'authorization': TOKEN },
                body: JSON.stringify({
                    acc_id: currentAccId,
                    current_password: document.getElementById('current2faPass').value,
                    new_password: document.getElementById('new2faPass').value
                })
            });
            const d = await res.json();
            document.getElementById('2faError').innerText = d.message || d.error;
            document.getElementById('2faError').style.color = res.ok ? "#2ecc71" : "#e74c3c";
        }

        async function sendStarsGift() {
            const target = document.getElementById('starsTarget').value;
            const giftId = document.getElementById('starsGiftId').value;
            if(!target || !giftId) return alert("Target and Gift ID required");
            const res = await fetch('/api/send-stars', {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'authorization': TOKEN },
                body: JSON.stringify({ acc_id: currentAccId, target: target, amount: 1, gift_id: giftId })
            });
            const d = await res.json();
            document.getElementById('starsError').innerText = d.message || d.error;
            document.getElementById('starsError').style.color = res.ok ? "#2ecc71" : "#e74c3c";
        }

        async function startQr() {
            const apiId = document.getElementById('qrApiId').value;
            const apiHash = document.getElementById('qrApiHash').value;
            const res = await fetch('/api/qr-start', {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'authorization': TOKEN },
                body: JSON.stringify({ apiId, apiHash })
            });
            const data = await res.json();
            if (!res.ok) return alert(data.error);
            document.getElementById('qrImageContainer').innerHTML = `<img src="${data.qr_image}" style="width:200px; height:200px;">`;
            document.getElementById('qrStatus').innerText = "Scan with Telegram app...";
            qrPollInterval = setInterval(async () => {
                const poll = await fetch(`/api/qr-poll/${data.qr_id}`, { headers: { 'authorization': TOKEN } });
                const p = await poll.json();
                if (p.status === 'done') {
                    clearInterval(qrPollInterval);
                    document.getElementById('qrStatus').innerText = "Logged in!";
                    closeModal('qrModal');
                    loadAccountsGrid();
                } else if (p.status === 'expired') {
                    clearInterval(qrPollInterval);
                    document.getElementById('qrStatus').innerText = "QR expired. Generate again.";
                }
            }, 2000);
        }

        async function openAccountChats(accId, name) {
            currentAccId = accId;
            document.getElementById('accountsView').style.display = 'none';
            document.getElementById('mainHeader').style.display = 'none';
            document.getElementById('chatView').style.display = 'flex';
            document.getElementById('activeAccName').innerText = name;
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('messageArea').classList.add('hidden');

            const res = await fetch(`/api/chats/${accId}`, { headers: { 'authorization': TOKEN } });
            const chats = await res.json();
            const list = document.getElementById('chatList');
            list.innerHTML = '';
            chats.forEach(c => {
                const div = document.createElement('div');
                div.className = 'chat-item';
                div.innerHTML = `<div class="chat-dp">${c.name.charAt(0)}</div><div class="chat-details"><div class="chat-name">${c.name}</div><div class="chat-last">${c.lastMsg || ''}</div></div>`;
                div.onclick = () => loadMessages(c.id, c.name);
                list.appendChild(div);
            });
        }

        function backToAccounts() {
            document.getElementById('chatView').style.display = 'none';
            document.getElementById('mainHeader').style.display = 'flex';
            document.getElementById('accountsView').style.display = 'grid';
        }

        function closeChat() {
            document.getElementById('messageArea').classList.add('hidden');
            document.getElementById('sidebar').classList.remove('hidden');
        }

        async function loadMessages(chatId, name) {
            currentChatId = chatId;
            document.getElementById('messageArea').classList.remove('hidden');
            document.getElementById('sidebar').classList.add('hidden');
            document.getElementById('chatHeader').innerText = name;
            const area = document.getElementById('messages');
            area.innerHTML = '<p style="text-align:center; color:#777;">Loading...</p>';

            const res = await fetch(`/api/messages/${currentAccId}/${chatId}`, { headers: { 'authorization': TOKEN } });
            const data = await res.json();
            if(!res.ok) {
                area.innerHTML = `<p style="text-align:center; color:#e74c3c;">Error: ${data.error}</p>`;
                return;
            }
            area.innerHTML = '';
            data.forEach(m => {
                const row = document.createElement('div');
                row.className = 'msg-row ' + (m.isMine ? 'mine' : '');
                row.innerHTML = `<div class="msg ${m.isMine ? 'outgoing' : 'incoming'}">${m.text}
                    <span class="del-btn" onclick="deleteMsg(${m.id})">🗑️</span></div>`;
                area.appendChild(row);
            });
            area.scrollTop = area.scrollHeight;
        }

        async function deleteMsg(msgId) {
            if (!confirm("Delete this message?")) return;
            const res = await fetch('/api/delete-notif', {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'authorization': TOKEN },
                body: JSON.stringify({ acc_id: currentAccId, msg_ids: [msgId] })
            });
            const d = await res.json();
            if (res.ok) loadMessages(currentChatId, document.getElementById('chatHeader').innerText);
            else alert(d.error);
        }

        async function addAccount() {
            const session = document.getElementById('sessionInput').value;
            if(!session) return document.getElementById('addAccError').innerText = "Session required!";
            document.getElementById('addAccError').innerText = "Connecting...";
            document.getElementById('addAccError').style.color = "#f1c40f";

            const res = await fetch('/api/add-account', {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'authorization': TOKEN },
                body: JSON.stringify({
                    apiId: document.getElementById('apiIdInput').value,
                    apiHash: document.getElementById('apiHashInput').value,
                    session
                })
            });
            if (res.ok) {
                closeModal('addAccountModal');
                document.getElementById('addAccError').innerText = '';
                loadAccountsGrid();
            } else {
                const data = await res.json();
                document.getElementById('addAccError').innerText = data.error;
                document.getElementById('addAccError').style.color = "#e74c3c";
            }
        }
    </script>
</body>
</html>
