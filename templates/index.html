<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noobster Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0e1621; --bg-sidebar: #17212b; --bg-hover: #202b36;
            --bg-active: #2b5278; --text-main: #ffffff; --text-muted: #7d8b99;
            --border-color: #101921; --bubble-in: #182533; --bubble-out: #2b5278; --accent: #2b5278;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { height: 100vh; height: 100dvh; background: var(--bg-main); color: var(--text-main); overflow: hidden; display: flex; flex-direction: column; }

        /* Login */
        #authScreen { position: fixed; inset: 0; background: var(--bg-main); display: flex; justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
        .auth-box { background: var(--bg-sidebar); padding: 40px 30px; border-radius: 20px; width: 100%; max-width: 380px; text-align: center; }
        .auth-box input { width: 100%; padding: 15px; margin: 20px 0; border-radius: 12px; border: 1px solid var(--accent); background: var(--bg-main); color: #fff; text-align: center; }
        .auth-box button { width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--accent); color: #fff; font-weight: bold; }

        /* Main */
        #mainScreen { display: none; flex: 1; flex-direction: column; height: 100%; }
        .top-header { background: var(--bg-sidebar); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .add-btn { background: var(--accent); color: #fff; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; }

        /* Accounts Grid */
        #accountsView { flex: 1; padding: 15px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; align-content: start; }
        .acc-card { background: var(--bg-sidebar); border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; border: 1px solid var(--border-color); }
        .acc-card img { width: 60px; height: 60px; border-radius: 50%; margin-bottom: 10px; }
        .acc-card h3 { font-size: 14px; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .acc-card p { font-size: 12px; color: var(--text-muted); }

        /* Chat View */
        #chatView { display: none; flex: 1; flex-direction: row; height: 100%; position: relative; overflow: hidden; }
        
        /* Sidebar List */
        #sidebar { width: 100%; height: 100%; background: var(--bg-sidebar); display: flex; flex-direction: column; position: absolute; inset: 0; z-index: 10; transition: transform 0.3s ease; }
        #sidebar.hidden { transform: translateX(-100%); }
        .sidebar-header { padding: 15px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border-color); background: var(--bg-sidebar); }
        .back-btn { background: transparent; border: none; color: #fff; font-size: 24px; padding: 0 10px; flex-shrink: 0; }
        #activeAccName { font-weight: 500; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        #chatList { flex: 1; overflow-y: auto; }
        .chat-item { padding: 12px 15px; border-bottom: 1px solid var(--border-color); display: flex; gap: 12px; align-items: center; }
        .chat-dp { width: 45px; height: 45px; border-radius: 50%; background: var(--accent); display: flex; justify-content: center; align-items: center; font-weight: bold; flex-shrink: 0; }
        .chat-details { flex: 1; min-width: 0; }
        .chat-name { font-weight: 500; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-last { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Message Area */
        #messageArea { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); width: 100%; height: 100%; position: absolute; inset: 0; z-index: 20; transition: transform 0.3s ease; }
        #messageArea.hidden { transform: translateX(100%); }
        .msg-header { padding: 12px 15px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; z-index: 21; }
        .msg-back { background: transparent; border: none; color: #fff; font-size: 24px; padding: 0 10px; flex-shrink: 0; }
        .msg-title { font-weight: 500; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg-row { display: flex; width: 100%; }
        .msg-row.mine { justify-content: flex-end; }
        .msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; font-size: 15px; word-wrap: break-word; }
        .msg.incoming { background: var(--bubble-in); border-bottom-left-radius: 4px; }
        .msg.outgoing { background: var(--bubble-out); border-bottom-right-radius: 4px; }

        /* Input Area */
        #inputArea { padding: 10px 15px; background: var(--bg-sidebar); display: flex; gap: 10px; z-index: 21; align-items: center; }
        #msgInput { flex: 1; padding: 12px 15px; border-radius: 20px; border: none; background: var(--bg-main); color: #fff; outline: none; font-size: 15px; }
        #sendBtn { background: var(--accent); border: none; width: 45px; height: 45px; border-radius: 50%; color: #fff; flex-shrink: 0; display: flex; justify-content: center; align-items: center; }

        /* Modal */
        #addAccountModal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-box { background: var(--bg-sidebar); padding: 25px 20px; border-radius: 15px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        .modal-box input, .modal-box textarea { padding: 12px; border-radius: 10px; border: 1px solid var(--accent); background: var(--bg-main); color: #fff; outline: none; font-size: 14px; width: 100%; }
        .modal-box button { padding: 12px; border-radius: 10px; border: none; background: var(--accent); color: #fff; font-weight: bold; cursor: pointer; }

        /* PC Layout Fix */
        @media (min-width: 900px) {
            #sidebar { position: relative; width: 350px; transform: none !important; border-right: 1px solid var(--border-color); z-index: 21; }
            #messageArea { position: relative; transform: none !important; }
            .msg-back { display: none; }
        }
    </style>
</head>
<body>

    <div id="authScreen">
        <div class="auth-box">
            <h2>Noobster Panel</h2>
            <input type="password" id="accessKeyInput" placeholder="Enter Access Key">
            <button onclick="verifyKey()">Login</button>
            <p id="authError" style="color: #e74c3c; font-size: 13px; margin-top: 10px;"></p>
        </div>
    </div>

    <div id="addAccountModal">
        <div class="modal-box">
            <h3>Add New Account</h3>
            <input type="text" id="apiIdInput" placeholder="API ID (Optional)">
            <input type="text" id="apiHashInput" placeholder="API HASH (Optional)">
            <textarea id="sessionInput" placeholder="Paste String Session here..." rows="3"></textarea>
            <button onclick="addAccount()">Connect Account</button>
            <p id="addAccError" style="color: #e74c3c; font-size: 13px; text-align: center;"></p>
            <button onclick="closeModal()" style="background: #333;">Cancel</button>
        </div>
    </div>

    <div id="mainScreen">
        <div class="top-header" id="mainHeader">
            <h2>My Accounts</h2>
            <button class="add-btn" onclick="openModal()">+ Add</button>
        </div>
        <div id="accountsView"></div>

        <div id="chatView">
            <div id="sidebar">
                <div class="sidebar-header">
                    <button class="back-btn" onclick="backToAccounts()">←</button>
                    <span id="activeAccName">Chats</span>
                </div>
                <div id="chatList"></div>
            </div>

            <div id="messageArea" class="hidden">
                <div class="msg-header">
                    <button class="msg-back" onclick="closeChat()">←</button>
                    <div class="msg-title" id="chatHeader">Select a chat</div>
                </div>
                <div id="messages"></div>
                <div id="inputArea">
                    <input type="text" id="msgInput" placeholder="Message..." onkeypress="if(event.key==='Enter') sendMsg()">
                    <button id="sendBtn" onclick="sendMsg()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const TOKEN = "secure_token_noobster";
        let currentAccId = null;
        let currentChatId = null;

        function openModal() { document.getElementById('addAccountModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('addAccountModal').style.display = 'none'; }

        async function verifyKey() {
            const res = await fetch('/api/auth', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ accessKey: document.getElementById('accessKeyInput').value })
            });
            if (res.ok) {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('mainScreen').style.display = 'flex';
                loadAccountsGrid();
            } else { document.getElementById('authError').innerText = "Invalid Key!"; }
        }

        async function loadAccountsGrid() {
            const res = await fetch('/api/accounts', { headers: { 'authorization': TOKEN } });
            const accounts = await res.json();
            const grid = document.getElementById('accountsView');
            grid.innerHTML = '';
            accounts.forEach(acc => {
                const card = document.createElement('div');
                card.className = 'acc-card';
                card.innerHTML = `<img src="${acc.photo}"><h3>${acc.name}</h3><p>📱 ${acc.phone}</p>`;
                card.onclick = () => openAccountChats(acc.id, acc.name);
                grid.appendChild(card);
            });
        }

        async function openAccountChats(accId, name) {
            currentAccId = accId;
            document.getElementById('accountsView').style.display = 'none';
            document.getElementById('mainHeader').style.display = 'none';
            document.getElementById('chatView').style.display = 'flex';
            document.getElementById('activeAccName').innerText = name;
            
            if(window.innerWidth < 900) {
                document.getElementById('sidebar').classList.remove('hidden');
                document.getElementById('messageArea').classList.add('hidden');
            }

            const list = document.getElementById('chatList');
            list.innerHTML = '<p style="text-align:center; padding:20px; color:#777;">Loading chats...</p>';

            const res = await fetch(`/api/chats/${accId}`, { headers: { 'authorization': TOKEN } });
            const data = await res.json();
            
            if(!res.ok) {
                list.innerHTML = `<p style="text-align:center; padding:20px; color:#e74c3c;">Error: ${data.error}</p>`;
                return;
            }

            list.innerHTML = data.length === 0 ? '<p style="text-align:center; padding:20px; color:#777;">No chats found.</p>' : '';
            
            data.forEach(c => {
                const div = document.createElement('div');
                div.className = 'chat-item';
                div.innerHTML = `<div class="chat-dp">${c.name.charAt(0).toUpperCase()}</div><div class="chat-details"><div class="chat-name">${c.name}</div><div class="chat-last">${c.lastMsg || ''}</div></div>`;
                div.onclick = () => loadMessages(c.id, c.name);
                list.appendChild(div);
            });
        }

        function backToAccounts() {
            document.getElementById('chatView').style.display = 'none';
            document.getElementById('mainHeader').style.display = 'flex';
            document.getElementById('accountsView').style.display = 'grid';
        }

        function closeChat() {
            document.getElementById('messageArea').classList.add('hidden');
            document.getElementById('sidebar').classList.remove('hidden');
        }

        async function loadMessages(chatId, name) {
            currentChatId = chatId;
            document.getElementById('messageArea').classList.remove('hidden');
            if(window.innerWidth < 900) {
                document.getElementById('sidebar').classList.add('hidden');
            }
            
            document.getElementById('chatHeader').innerText = name;
            const area = document.getElementById('messages');
            area.innerHTML = '<p style="text-align:center; color:#777;">Loading...</p>';
            
            const res = await fetch(`/api/messages/${currentAccId}/${chatId}`, { headers: { 'authorization': TOKEN } });
            const data = await res.json();
            area.innerHTML = '';
            
            if(data.length === 0) {
                area.innerHTML = '<p style="text-align:center; color:#777;">No messages here yet.</p>';
                return;
            }

            data.forEach(m => {
                const row = document.createElement('div');
                row.className = 'msg-row ' + (m.isMine ? 'mine' : '');
                row.innerHTML = `<div class="msg ${m.isMine ? 'outgoing' : 'incoming'}">${m.text}</div>`;
                area.appendChild(row);
            });
            area.scrollTop = area.scrollHeight;
        }

        async function sendMsg() {
            const text = document.getElementById('msgInput').value;
            if(!text || !currentAccId || !currentChatId) return;

            document.getElementById('msgInput').value = ''; 
            
            const area = document.getElementById('messages');
            const row = document.createElement('div');
            row.className = 'msg-row mine';
            row.innerHTML = `<div class="msg outgoing">${text}</div>`;
            area.appendChild(row);
            area.scrollTop = area.scrollHeight;

            await fetch(`/api/send/${currentAccId}/${currentChatId}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'authorization': TOKEN },
                body: JSON.stringify({ text })
            });
        }

        async function addAccount() {
            const session = document.getElementById('sessionInput').value;
            if(!session) {
                document.getElementById('addAccError').innerText = "Session required!";
                return;
            }
            document.getElementById('addAccError').innerText = "Connecting...";
            
            const res = await fetch('/api/add-account', {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'authorization': TOKEN },
                body: JSON.stringify({ 
                    apiId: document.getElementById('apiIdInput').value, 
                    apiHash: document.getElementById('apiHashInput').value, 
                    session 
                })
            });
            
            if (res.ok) {
                closeModal();
                loadAccountsGrid();
            } else {
                const data = await res.json();
                document.getElementById('addAccError').innerText = data.error;
            }
        }
    </script>
</body>
    </html>
